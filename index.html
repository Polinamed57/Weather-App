<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkyCast Weather Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style/style.css" />
</head>
<body>
  <div class="weather-overlay" aria-hidden="true">
    <div class="sun-layer"></div>
    <div class="cloud-layer cloud-layer-one"></div>
    <div class="cloud-layer cloud-layer-two"></div>
    <div class="rain-layer"></div>
    <div class="snow-layer"></div>
    <div class="mist-layer"></div>
    <div class="storm-flash"></div>
  </div>

  <main class="app-shell">
    <section class="dashboard">
      <header class="dashboard-header">
        <div class="header-copy">
          <h1>SkyCast</h1>
        </div>

        <div class="header-actions">
          <button id="themeToggle" class="ghost-button" type="button" aria-label="Toggle light or dark mode">
            Dark Mode
          </button>
        </div>
      </header>

      <div class="search-wrap">
        <form class="weatherForm search-bar" id="weatherForm" novalidate>
          <label for="cityInput" class="sr-only">City name</label>
          <input
            type="text"
            class="cityInput"
            id="cityInput"
            placeholder="Search for a city..."
            autocomplete="off"
            autofocus
          />
          <button type="submit" id="submitButton">Search</button>
        </form>
        <div class="search-dropdown hidden" id="searchDropdown"></div>
      </div>

      <div class="toolbar">
        <div class="unit-toggle" role="group" aria-label="Temperature unit">
          <button type="button" class="unit-button active" data-unit="metric">°C</button>
          <button type="button" class="unit-button" data-unit="imperial">°F</button>
        </div>

        <button type="button" id="locationButton" class="ghost-button">
          Use My Location
        </button>
      </div>

      <section class="message hidden" id="message" role="status" aria-live="polite"></section>

      <section class="main-panel hidden" id="card" aria-live="polite">
        <div class="current-weather glass-panel">
          <div class="current-top">
            <div>
              <p class="location-tag" id="locationMeta">Current Conditions</p>
              <h2 class="cityDisplay" id="cityDisplay"></h2>
              <p class="descDisplay" id="descDisplay"></p>
              <button type="button" class="text-button favorite-toggle hidden" id="favoriteToggle">
                Add to Favorites
              </button>
            </div>

            <div class="weather-visual">
              <div class="weatherEmoji" id="weatherEmoji"></div>
            </div>
          </div>

          <div class="temperature-block">
            <p class="tempDisplay" id="tempDisplay"></p>
            <p class="feelsLikeDisplay" id="feelsLikeDisplay"></p>
            <p class="last-updated" id="lastUpdatedDisplay"></p>
          </div>

          <div class="sun-arc-block">
            <div class="sun-arc-times">
              <div class="sun-arc-label-group">
                <span class="sun-time-label"><svg class="sun-label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="2" y1="18" x2="4" y2="18"/><line x1="20" y1="18" x2="22" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><polyline points="8 6 12 2 16 6"/></svg> Sunrise</span>
                <span class="sun-time-value" id="sunriseDisplay"></span>
              </div>
              <div class="sun-arc-label-group sun-arc-label-right">
                <span class="sun-time-label"><svg class="sun-label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 18a5 5 0 0 0-10 0"/><line x1="12" y1="9" x2="12" y2="2"/><line x1="4.22" y1="10.22" x2="5.64" y2="11.64"/><line x1="2" y1="18" x2="4" y2="18"/><line x1="20" y1="18" x2="22" y2="18"/><line x1="18.36" y1="11.64" x2="19.78" y2="10.22"/><polyline points="16 5 12 9 8 5"/></svg> Sunset</span>
                <span class="sun-time-value" id="sunsetDisplay"></span>
              </div>
            </div>
            <div class="sun-arc-wrap" aria-hidden="true">
              <svg class="sun-arc-svg" viewBox="0 0 260 80" xmlns="http://www.w3.org/2000/svg">
                <path id="sunArcTrack" d="M10 72 Q130 -10 250 72" fill="none" stroke-width="2" stroke-linecap="round"/>
                <path id="sunArcProgress" d="M10 72 Q130 -10 250 72" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="290" stroke-dashoffset="290"/>
                <circle id="sunDot" cx="10" cy="72" r="6"/>
                <line x1="4" y1="75" x2="256" y2="75" stroke-width="1"/>
              </svg>
            </div>
          </div>
        </div>

        <div class="weather-details">
          <article class="detail-card reveal-delay-1">
            <span class="detail-label">
              <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
              Humidity
            </span>
            <span class="detail-value" id="humidityDisplay"></span>
          </article>

          <article class="detail-card reveal-delay-2">
            <span class="detail-label">
              <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.7 7.7a2.5 2.5 0 1 1 1.8 4.3H2"/><path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/></svg>
              Wind
            </span>
            <span class="detail-value" id="windDisplay"></span>
          </article>

          <article class="detail-card reveal-delay-3">
            <span class="detail-label">
              <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12a10 10 0 1 0 20 0"/><path d="M12 12l3-4"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/></svg>
              Pressure
            </span>
            <span class="detail-value" id="pressureDisplay"></span>
          </article>

          <article class="detail-card reveal-delay-4">
            <span class="detail-label">
              <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/></svg>
              Min / Max
            </span>
            <span class="detail-value" id="minMaxDisplay"></span>
          </article>

          <article class="detail-card reveal-delay-5">
            <span class="detail-label">
              <svg class="detail-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              Visibility
            </span>
            <span class="detail-value" id="visibilityDisplay"></span>
          </article>

        </div>
      </section>

      <section class="forecast-section">
        <div class="history-header">
          <h3>5-Day Forecast</h3>
        </div>
        <div class="forecast-grid" id="forecastGrid">
          <p class="empty-text">Search a city to view the forecast.</p>
        </div>
      </section>

      <section class="forecast-section">
        <div class="hourly-grid" id="hourlyGrid">
          <p class="empty-text">Search a city to view hourly trend.</p>
        </div>
      </section>

    </section>
  </main>

  <script src="js/script.js"></script>
</body>
</html>
